<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - SwiftPOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              // Premium professional color palette
              primary: {
                50: "#f8fafc",
                100: "#f1f5f9",
                200: "#e2e8f0",
                300: "#cbd5e1",
                400: "#94a3b8",
                500: "#64748b",
                600: "#475569",
                700: "#334155",
                800: "#1e293b",
                900: "#0f172a",
              },
              accent: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              surface: {
                light: "rgba(255, 255, 255, 0.02)",
                medium: "rgba(255, 255, 255, 0.04)",
                dark: "rgba(0, 0, 0, 0.2)",
              },
            },
            animation: {
              // Premium smooth animations
              "fade-in": "fadeIn 0.8s ease-out",
              "fade-in-up": "fadeInUp 0.8s ease-out",
              "fade-in-down": "fadeInDown 0.8s ease-out",
              "fade-in-left": "fadeInLeft 0.8s ease-out",
              "fade-in-right": "fadeInRight 0.8s ease-out",
              "scale-in": "scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1)",
              "slide-up": "slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1)",
              "slide-down": "slideDown 0.8s cubic-bezier(0.16, 1, 0.3, 1)",
              "float-slow": "float 6s ease-in-out infinite",
              "float-slower": "float 8s ease-in-out infinite",
              "pulse-soft":
                "pulseSoft 2s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "spin-slow": "spin 3s linear infinite",
              "border-flow": "borderFlow 3s linear infinite",
              shimmer: "shimmer 2s infinite",
              morph: "morph 10s ease-in-out infinite",
              "glow-subtle": "glowSubtle 3s ease-in-out infinite alternate",
            },
            keyframes: {
              fadeIn: {
                "0%": { opacity: "0" },
                "100%": { opacity: "1" },
              },
              fadeInUp: {
                "0%": { opacity: "0", transform: "translateY(20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeInDown: {
                "0%": { opacity: "0", transform: "translateY(-20px)" },
                "100%": { opacity: "1", transform: "translateY(0)" },
              },
              fadeInLeft: {
                "0%": { opacity: "0", transform: "translateX(-20px)" },
                "100%": { opacity: "1", transform: "translateX(0)" },
              },
              fadeInRight: {
                "0%": { opacity: "0", transform: "translateX(20px)" },
                "100%": { opacity: "1", transform: "translateX(0)" },
              },
              scaleIn: {
                "0%": { transform: "scale(0.95)", opacity: "0" },
                "100%": { transform: "scale(1)", opacity: "1" },
              },
              slideUp: {
                "0%": { transform: "translateY(100px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              slideDown: {
                "0%": { transform: "translateY(-100px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-15px)" },
              },
              pulseSoft: {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: "0.7" },
              },
              borderFlow: {
                "0%": { backgroundPosition: "0% 50%" },
                "50%": { backgroundPosition: "100% 50%" },
                "100%": { backgroundPosition: "0% 50%" },
              },
              shimmer: {
                "0%": { backgroundPosition: "-200px 0" },
                "100%": { backgroundPosition: "calc(200px + 100%) 0" },
              },
              morph: {
                "0%": { borderRadius: "60% 40% 30% 70% / 60% 30% 70% 40%" },
                "50%": { borderRadius: "30% 60% 70% 40% / 50% 60% 30% 60%" },
                "100%": { borderRadius: "60% 40% 30% 70% / 60% 30% 70% 40%" },
              },
              glowSubtle: {
                "0%": { boxShadow: "0 0 20px rgba(14, 165, 233, 0.1)" },
                "100%": { boxShadow: "0 0 30px rgba(14, 165, 233, 0.2)" },
              },
            },
            backdropBlur: {
              xs: "2px",
              sm: "4px",
              md: "8px",
              lg: "12px",
              xl: "16px",
            },
            transitionTimingFunction: {
              "smooth-snap": "cubic-bezier(0.16, 1, 0.3, 1)",
              "smooth-enter": "cubic-bezier(0.34, 1.56, 0.64, 1)",
            },
          },
        },
      };
    </script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js");
        });
      }
    </script>
    <style>
      /* Premium CSS enhancements */
      :root {
        --color-surface-light: rgba(255, 255, 255, 0.02);
        --color-surface-medium: rgba(255, 255, 255, 0.04);
        --color-surface-dark: rgba(0, 0, 0, 0.2);
      }

      body {
        font-family: "Inter", sans-serif;
        background: #0f172a;
        color: #f1f5f9;
        overflow-x: hidden;
        scroll-behavior: smooth;
      }

      /* Premium glass effect */
      .glass-premium {
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.05),
          rgba(255, 255, 255, 0.02)
        );
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1),
          inset 0 1px 0 rgba(255, 255, 255, 0.1);
      }

      /* Premium button effect */
      .btn-premium {
        position: relative;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .btn-premium::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.1);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .btn-premium:hover::before {
        width: 300px;
        height: 300px;
      }

      /* Premium focus styles */
      .focus-premium:focus {
        outline: none;
        border-color: #0ea5e9;
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
      }

      /* Loading animation */
      .loading-dots::after {
        content: "";
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: "";
        }
        40% {
          content: ".";
        }
        60% {
          content: "..";
        }
        80%,
        100% {
          content: "...";
        }
      }

      /* Premium scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Premium selection */
      ::selection {
        background: rgba(14, 165, 233, 0.3);
        color: white;
      }

      /* Input field animations */
      .input-field {
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .input-field:focus {
        transform: translateY(-1px);
        box-shadow: 0 4px 20px rgba(14, 165, 233, 0.15);
      }

      /* Pulse animation for logo */
      @keyframes pulse-glow {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.8;
        }
      }

      .pulse-glow {
        animation: pulse-glow 2s ease-in-out infinite;
      }
    </style>
  </head>

  <body
    class="bg-primary-900 text-primary-100 font-inter overflow-x-hidden dark"
  >
    <!-- Animated Background -->
    <div class="fixed inset-0 z-0 overflow-hidden">
      <div
        class="absolute inset-0 bg-gradient-to-br from-primary-900 via-primary-800 to-primary-900"
      ></div>

      <!-- Animated background elements -->
      <div class="absolute inset-0 opacity-10">
        <div
          class="absolute top-1/4 left-1/4 w-64 h-64 bg-accent-500/5 rounded-full animate-float-slower animate-morph"

        <div

      </div>

      <!-- Grid overlay -->

        class="absolute inset-0 opacity-5"

          background-image: radial-gradient(
            circle at 1px 1px,
            rgba(255, 255, 255, 0.1) 1px,
            transparent 0
          );
          background-size: 40px 40px;
        "
      ></div>

      <!-- Floating particles -->
      <div class="absolute inset-0">
        <div
          class="particle w-2 h-2 bg-accent-400 top-1/4 left-1/4 animate-float"
        ></div>
        <div
          class="particle w-3 h-3 bg-accent-400/60 top-3/4 left-3/4 animate-float"
          style="animation-delay: 1s"
        ></div>
        <div
          class="particle w-1 h-1 bg-accent-400/40 top-1/2 left-1/2 animate-float"
          style="animation-delay: 2s"
        ></div>
      </div>
    </div>

    <!-- Back to Home Button -->
    <a
      href="index.html"
      class="fixed top-6 left-6 z-50 glass-premium rounded-xl p-3 hover:bg-surface-light transition-all duration-300 group animate-fade-in"
    >
      <i
        class="fas fa-arrow-left text-primary-300 group-hover:text-accent-400 transition-colors duration-200"
      ></i>
    </a>

    <!-- Dark Mode Toggle -->
    <button
      id="theme-toggle"
      class="fixed top-6 right-6 z-50 glass-premium rounded-xl p-3 hover:bg-surface-light transition-all duration-300 group animate-fade-in"
    >
      <i
        class="fas fa-moon text-primary-300 group-hover:text-accent-400 transition-colors duration-200"
      ></i>
    </button>

    <div
      class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10"
    >
      <div class="w-full max-w-md animate-scale-in">
        <!-- Brand Logo -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center mb-6">
            <div
              class="w-16 h-16 bg-gradient-to-br from-accent-500 to-accent-600 rounded-2xl flex items-center justify-center shadow-xl pulse-glow"
            >
              <i class="fas fa-bolt text-white text-2xl"></i>
            </div>
          </div>
          <div class="space-y-2">
            <h1 class="text-3xl font-black tracking-tight">
              Swift<span class="text-accent-400">POS</span>
            </h1>
            <p class="text-primary-400 text-sm tracking-wider font-medium">
              ENTERPRISE POS SYSTEM
            </p>
          </div>
        </div>

        <!-- Login Card -->
        <div class="glass-premium rounded-2xl p-8 shadow-2xl">
          <!-- Header -->
          <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-primary-100 mb-2">
              Welcome Back
            </h2>
            <p class="text-primary-400">
              Enter your credentials to access the system
            </p>
          </div>

          <!-- Error Alert -->
          <div
            id="loginAlert"
            class="hidden bg-red-900/20 border border-red-700 text-red-400 px-4 py-3 rounded-xl mb-6 transition-all duration-300"

              <span id="loginAlertMessage" class="block sm:inline"></span>

          </div>

          <!-- Login Form -->
          <form id="loginForm" class="space-y-6">
            <!-- Email Field -->
            <div class="space-y-2">
              <label
                for="username"
                class="text-sm font-medium text-primary-300"

                User Email
              </label>
              <div class="relative group">

                </div>
                <input

                />
                <div

            <!-- Business Name Field -->

                <input

                  ></div>
                </div>
              </div>
            </div>

            <!-- Password Field -->

              <div class="flex items-center justify-between">
                <label
                  for="password"
                  class="text-sm font-medium text-primary-300"
                >
                  Password

                <a
                  href="forgot-password.html"
                  class="text-sm text-accent-400 hover:text-accent-300 transition-colors duration-200 font-medium"
                >
                  Forgot password?
                </a>
              </div>
              <div class="relative group">
                <div
                  class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
                >
                  <i
                    class="fas fa-lock text-primary-400 group-hover:text-accent-400 transition-colors duration-200"

                </div>
                <input

                  placeholder="••••••••"
                />
                <div class="absolute inset-y-0 right-0 pr-4 flex items-center">
                  <button

                    class="text-primary-400 hover:text-accent-400 transition-colors duration-200 focus:outline-none"
                    onclick="togglePasswordVisibility()"
                  >
                    <i class="fas fa-eye"></i>

                </div>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center space-x-3">
              <div class="relative">
                <input
                  id="remember-me"
                  name="remember-me"
                  type="checkbox"
                  class="sr-only"

                <div
                  class="w-5 h-5 border-2 border-primary-600 rounded flex items-center justify-center transition-all duration-200 peer-checked:bg-accent-500 peer-checked:border-accent-500"
                >
                  <i
                    class="fas fa-check text-white text-xs opacity-0 peer-checked:opacity-100 transition-opacity duration-200"
                  ></i>
                </div>
                <label
                  for="remember-me"
                  class="ml-2 text-sm text-primary-300 cursor-pointer"
                >
                  Remember me
                </label>
              </div>
            </div>

            <!-- Submit Button -->
            <button
              type="submit"
              class="btn-premium w-full bg-gradient-to-r from-accent-500 to-accent-600 hover:from-accent-600 hover:to-accent-700 text-white py-4 rounded-xl font-semibold text-base transition-all duration-300 hover:scale-105 hover:shadow-xl hover:shadow-accent-500/20 flex items-center justify-center group"

        <!-- Security Notice -->

          </div>
        </div>

    <!-- Toast Container -->
    <div
      id="toast-container"
      class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[999] space-y-2 pointer-events-none"
    ></div>

    <script>
      // Theme Toggle Script (preserved)
      const themeToggle = document.getElementById("theme-toggle");
      if (themeToggle) {
        themeToggle.addEventListener("click", () => {
          document.documentElement.classList.toggle("dark");
          const icon = themeToggle.querySelector("i");
          icon.classList.toggle("fa-moon");
          icon.classList.toggle("fa-sun");
        });
      }

      // Password visibility toggle
      function togglePasswordVisibility() {
        const passwordInput = document.getElementById("password");
        const eyeIcon = passwordInput.parentElement.querySelector("i");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        }
      }

      // Enhanced Toast Notification System
      function showToast(message, type = "info") {
        const toastContainer = document.getElementById("toast-container");
        if (!toastContainer) {
          const newToastContainer = document.createElement("div");
          newToastContainer.id = "toast-container";
          newToastContainer.className =
            "fixed top-6 left-1/2 transform -translate-x-1/2 z-[999] space-y-2 pointer-events-none";
          document.body.appendChild(newToastContainer);
        }

        const toast = document.createElement("div");
        const colors = {
          success: "from-accent-500 to-accent-600",
          error: "from-red-500 to-red-600",
          warning: "from-yellow-500 to-yellow-600",
          info: "from-accent-500 to-accent-600",
        };

        const icons = {
          success: "fa-check-circle",
          error: "fa-exclamation-circle",
          warning: "fa-exclamation-triangle",
          info: "fa-info-circle",
        };

        toast.className = `glass-premium rounded-xl p-4 text-white font-medium transform transition-all duration-300 animate-fade-in-up pointer-events-auto`;
        toast.innerHTML = `
          <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-gradient-to-r ${colors[type]} rounded-lg flex items-center justify-center flex-shrink-0">
              <i class="fas ${icons[type]} text-white text-sm"></i>
            </div>
            <span class="flex-1">${message}</span>
            <button class="text-primary-300 hover:text-white ml-2 transition-colors duration-200" onclick="this.parentElement.parentElement.remove()">
              <i class="fas fa-times"></i>
            </button>
          </div>
        `;

        document.getElementById("toast-container").appendChild(toast);

        setTimeout(() => {
          toast.style.transform = "translateY(-100%)";
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // Particle animation (enhanced)
      function createParticle() {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.width = Math.random() * 3 + 1 + "px";
        particle.style.height = particle.style.width;
        particle.style.backgroundColor = `rgba(14, 165, 233, ${
          Math.random() * 0.3 + 0.1
        })`;
        particle.style.animationDelay = Math.random() * 3 + "s";

        const container = document.querySelector(".absolute.inset-0");
        if (container) {
          container.appendChild(particle);

          setTimeout(() => {
            particle.style.opacity = "0";
            particle.style.transform = "translateY(-100px)";
            setTimeout(() => particle.remove(), 1000);
          }, 4000);
        }
      }

      // Create particles periodically
      setInterval(createParticle, 1000);

      // Enhanced form handling (preserving original logic structure)
      document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        const loginAlert = document.getElementById("loginAlert");
        const loginAlertMessage = document.getElementById("loginAlertMessage");
        const rememberMeCheckbox = document.getElementById("remember-me");

        // Load saved credentials if remember me was checked
        if (localStorage.getItem("rememberMe") === "true") {
          const savedEmail = localStorage.getItem("savedEmail");
          const savedBusiness = localStorage.getItem("savedBusiness");
          if (savedEmail)
            document.getElementById("username").value = savedEmail;
          if (savedBusiness)
            document.getElementById("businessName").value = savedBusiness;
          if (rememberMeCheckbox) rememberMeCheckbox.checked = true;
        }

        // Enhanced checkbox styling
        if (rememberMeCheckbox) {
          const checkboxContainer =
            rememberMeCheckbox.parentElement.parentElement;
          rememberMeCheckbox.addEventListener("change", function () {
            if (this.checked) {
              checkboxContainer.classList.add(
                "peer-checked:bg-accent-500",
                "peer-checked:border-accent-500"
              );
            }
          });
        }

        if (loginForm) {
          loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const businessName = document
              .getElementById("businessName")
              .value.trim();
            const password = document.getElementById("password").value;
            const rememberMe = document.getElementById("remember-me").checked;

            // Save credentials if remember me is checked
            if (rememberMe) {
              localStorage.setItem("rememberMe", "true");
              localStorage.setItem("savedEmail", username);
              localStorage.setItem("savedBusiness", businessName);
            } else {
              localStorage.removeItem("rememberMe");
              localStorage.removeItem("savedEmail");
              localStorage.removeItem("savedBusiness");
            }

            // Show loading state
            const submitButton = loginForm.querySelector(
              'button[type="submit"]'
            );
            const originalText = submitButton.innerHTML;
            submitButton.innerHTML =
              '<i class="fas fa-spinner fa-spin mr-3"></i>Signing In...';
            submitButton.disabled = true;

            // Hide previous alerts
            if (loginAlert) {
              loginAlert.classList.add("hidden");
            }

            try {
              // Replace with your actual API endpoint
              const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email: username,
                  businessName: businessName,
                  password: password,
                }),
              });

              const data = await response.json();

              if (response.ok) {
                showToast("Login successful! Redirecting...", "success");

                // Store token
                localStorage.setItem("token", data.token);
                document.cookie = `token=${data.token}; path=/; max-age=${
                  24 * 60 * 60
                }`;

                // Redirect to dashboard
                setTimeout(() => {
                  window.location.href = "dashboard.html";
                }, 1500);
              } else {
                // Show error in alert box
                if (loginAlert && loginAlertMessage) {
                  loginAlertMessage.textContent =
                    data.message || "Invalid credentials";
                  loginAlert.classList.remove("hidden");
                  loginAlert.classList.add("animate-fade-in");
                }
                showToast(
                  "Login failed. Please check your credentials.",
                  "error"
                );
              }
            } catch (error) {
              console.error("Login error:", error);
              if (loginAlert && loginAlertMessage) {
                loginAlertMessage.textContent =
                  "Network error. Please try again.";
                loginAlert.classList.remove("hidden");
                loginAlert.classList.add("animate-fade-in");
              }
              showToast("Network error. Please try again.", "error");
            } finally {
              // Restore button state
              submitButton.innerHTML = originalText;
              submitButton.disabled = false;
            }
          });
        }

        // Add input field animations
        const inputs = document.querySelectorAll(
          'input[type="text"], input[type="password"], input[type="email"]'
        );
        inputs.forEach((input) => {
          input.addEventListener("focus", function () {
            this.parentElement.classList.add("ring-2", "ring-accent-500/20");
          });

          input.addEventListener("blur", function () {
            this.parentElement.classList.remove("ring-2", "ring-accent-500/20");
          });
        });

        // Add subtle animations on page load
        const formElements = document.querySelectorAll("#loginForm > *");
        formElements.forEach((element, index) => {
          element.style.animationDelay = `${index * 0.1}s`;
          element.classList.add("animate-fade-in-up");
        });
      });

      // Enhanced checkbox functionality
      document.addEventListener("DOMContentLoaded", function () {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
          checkbox.addEventListener("change", function () {
            const parent = this.parentElement;
            if (this.checked) {
              parent.classList.add("checked");
            } else {
              parent.classList.remove("checked");
            }
          });
        });
      });

      // Keyboard shortcuts
      document.addEventListener("keydown", function (e) {
        // Ctrl + Enter to submit form
        if (e.ctrlKey && e.key === "Enter") {
          const loginForm = document.getElementById("loginForm");
          if (loginForm) {
            const submitEvent = new Event("submit", { cancelable: true });
            loginForm.dispatchEvent(submitEvent);
          }
        }

        // Escape to clear form
        if (e.key === "Escape") {
          const loginForm = document.getElementById("loginForm");
          if (loginForm) {
            loginForm.reset();
            const loginAlert = document.getElementById("loginAlert");
            if (loginAlert) {
              loginAlert.classList.add("hidden");
            }
          }
        }
      });
    </script>

    <!-- Preserved external login.js -->
    <script src="js/login.js"></script>
  </body>
</html>
