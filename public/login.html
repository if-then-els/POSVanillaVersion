<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Tailwind configuration from manageSubscriptions.html
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              inter: ["Inter", "sans-serif"],
            },
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
              accent: {
                50: "#fdf4ff",
                100: "#fae8ff",
                200: "#f5d0fe",
                300: "#f0abfc",
                400: "#e879f9",
                500: "#d946ef",
                600: "#c026d3",
                700: "#a21caf",
                800: "#86198f",
                900: "#701a75",
              },
              success: {
                50: "#f0fdf4",
                100: "#dcfce7",
                200: "#bbf7d0",
                300: "#86efac",
                400: "#4ade80",
                500: "#22c55e",
                600: "#16a34a",
                700: "#15803d",
                800: "#166534",
                900: "#14532d",
              },
            },
            animation: {
              float: "float 6s ease-in-out infinite",
              "pulse-slow": "pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite",
              "bounce-slow": "bounce 3s infinite",
              "spin-slow": "spin 8s linear infinite",
              gradient: "gradient 15s ease infinite",
              "slide-up": "slideUp 0.5s ease-out",
              "slide-in": "slideIn 0.6s ease-out",
              "scale-in": "scaleIn 0.4s ease-out",
              glow: "glow 2s ease-in-out infinite alternate",
            },
            keyframes: {
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-20px)" },
              },
              gradient: {
                "0%, 100%": {
                  "background-size": "200% 200%",
                  "background-position": "left center",
                },
                "50%": {
                  "background-size": "200% 200%",
                  "background-position": "right center",
                },
              },
              slideUp: {
                "0%": { transform: "translateY(100px)", opacity: "0" },
                "100%": { transform: "translateY(0)", opacity: "1" },
              },
              slideIn: {
                "0%": { transform: "translateX(-100px)", opacity: "0" },
                "100%": { transform: "translateX(0)", opacity: "1" },
              },
              scaleIn: {
                "0%": { transform: "scale(0.8)", opacity: "0" },
                "100%": { transform: "scale(1)", opacity: "1" },
              },
              glow: {
                "0%": { boxShadow: "0 0 20px rgba(14, 165, 233, 0.5)" },
                "100%": { boxShadow: "0 0 40px rgba(14, 165, 233, 0.8)" },
              },
            },
            backdropBlur: {
              xs: "2px",
            },
          },
        },
      };
    </script>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js");
        });
      }
    </script>
    <style>
      /* Custom styles from manageSubscriptions.html */
      body {
        font-family: "Inter", sans-serif;
      }

      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .glass-dark {
        background: rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .gradient-bg {
        background: linear-gradient(-45deg, #0ea5e9, #d946ef, #22c55e, #f59e0b);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }

      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.6;
        animation: float 6s ease-in-out infinite;
      }

      .particle:nth-child(1) {
        animation-delay: 0s;
      }
      .particle:nth-child(2) {
        animation-delay: 1s;
      }
      .particle:nth-child(3) {
        animation-delay: 2s;
      }
      .particle:nth-child(4) {
        animation-delay: 3s;
      }
      .particle:nth-child(5) {
        animation-delay: 4s;
      }

      .hover-lift {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .hover-lift:hover {
        transform: translateY(-8px);
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }

      .neon-border {
        position: relative;
        overflow: hidden;
      }

      .neon-border::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(14, 165, 233, 0.4),
          transparent
        );
        transition: left 0.5s;
      }

      .neon-border:hover::before {
        left: 100%;
      }

      .typing-animation {
        overflow: hidden;
        border-right: 2px solid #0ea5e9;
        white-space: nowrap;
        animation: typing 3.5s steps(40, end),
          blink-caret 0.75s step-end infinite;
      }

      @keyframes typing {
        from {
          width: 0;
        }
        to {
          width: 100%;
        }
      }

      @keyframes blink-caret {
        from,
        to {
          border-color: transparent;
        }
        50% {
          border-color: #0ea5e9;
        }
      }

      .progress-ring {
        transform: rotate(-90deg);
      }
      .progress-ring-circle {
        transition: stroke-dashoffset 0.35s;
        transform-origin: 50% 50%;
      }

      .morphing-blob {
        border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        animation: morph 8s ease-in-out infinite;
      }

      @keyframes morph {
        0% {
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
        50% {
          border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%;
        }
        100% {
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
        }
      }

      .scroll-reveal {
        opacity: 0;
        transform: translateY(50px);
        transition: all 0.6s ease-out;
      }

      .scroll-reveal.revealed {
        opacity: 1;
        transform: translateY(0);
      }

      /* Adapted styles from original login.html */
      [type="text"]:focus,
      [type="email"]:focus,
      [type="password"]:focus {
        box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.2); /* Using primary-500 from new palette */
        border-color: #0ea5e9; /* Using primary-500 from new palette */
      }
    </style>
  </head>
  <body class="bg-gray-900 text-white font-inter overflow-x-hidden">
    <!-- Animated Background -->
    <div class="fixed inset-0 z-0">
      <div class="gradient-bg absolute inset-0 opacity-20"></div>
      <div class="absolute inset-0">
        <div class="particle w-2 h-2 bg-primary-400 top-1/4 left-1/4"></div>
        <div class="particle w-3 h-3 bg-accent-400 top-3/4 left-3/4"></div>
        <div class="particle w-1 h-1 bg-success-400 top-1/2 left-1/2"></div>
        <div class="particle w-2 h-2 bg-yellow-400 top-1/3 left-2/3"></div>
        <div class="particle w-1 h-1 bg-pink-400 top-2/3 left-1/3"></div>
      </div>
    </div>

    <!-- Dark Mode Toggle -->
    <button
      id="theme-toggle"
      class="fixed top-6 right-6 z-50 glass rounded-full p-3 hover:scale-110 transition-all duration-300 group"
    >
      <i
        class="fas fa-moon text-yellow-400 group-hover:rotate-12 transition-transform duration-300"
      ></i>
    </button>

    <div
      class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10"
    >
      <div
        class="max-w-md w-full space-y-8 glass-dark p-10 rounded-3xl shadow-lg animate-scale-in"
      >
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
            <div class="flex-shrink-0 flex items-center justify-center">
              <i
                class="fas fa-cash-register text-primary-400 text-2xl mr-2"
              ></i>
              <span
                class="text-xl font-bold bg-gradient-to-r from-primary-400 to-accent-400 bg-clip-text text-transparent"
                >SwiftPOS System Login</span
              >
            </div>
          </h2>
          <p class="mt-2 text-center text-sm text-gray-400">
            Enter your credentials to access the system
          </p>
        </div>

        <!-- Alert for errors -->
        <div
          id="loginAlert"
          class="hidden bg-red-900/20 border border-red-700 text-red-400 px-4 py-3 rounded-xl relative"
          role="alert"
        >
          <span id="loginAlertMessage" class="block sm:inline"></span>
        </div>

        <form id="loginForm" class="mt-8 space-y-6">
          <div class="rounded-md shadow-sm -space-y-px">
            <div>
              <label for="username" class="sr-only">User Email</label>
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <i class="fas fa-user text-gray-400"></i>
                </div>
                <input
                  id="username"
                  name="email"
                  type="text"
                  required
                  class="appearance-none rounded-t-xl relative block w-full px-3 py-3 pl-10 border border-gray-600 placeholder-gray-400 text-white bg-gray-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
                  placeholder="User's Email"
                />
              </div>
            </div>
            <div>
              <label for="businessName" class="sr-only">Business Name</label>
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <i class="fas fa-building text-gray-400"></i>
                </div>
                <input
                  id="businessName"
                  name="businessName"
                  type="text"
                  required
                  class="appearance-none rounded-none relative block w-full px-3 py-3 pl-10 border border-gray-600 placeholder-gray-400 text-white bg-gray-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
                  placeholder="Business Name"
                />
              </div>
            </div>
            <div>
              <label for="password" class="sr-only">Password</label>
              <div class="relative">
                <div
                  class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
                >
                  <i class="fas fa-lock text-gray-400"></i>
                </div>
                <input
                  id="password"
                  name="password"
                  type="password"
                  required
                  class="appearance-none rounded-b-xl relative block w-full px-3 py-3 pl-10 border border-gray-600 placeholder-gray-400 text-white bg-gray-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 focus:z-10 sm:text-sm"
                  placeholder="Password"
                />
              </div>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center">
              <input
                id="remember-me"
                name="remember-me"
                type="checkbox"
                class="h-4 w-4 text-primary-500 focus:ring-primary-500 border-gray-600 rounded"
              />
              <label for="remember-me" class="ml-2 block text-sm text-gray-300">
                Remember me
              </label>
            </div>

            <div class="text-sm">
              <a
                href="#"
                class="font-medium text-primary-400 hover:text-primary-300 transition-colors"
              >
                Forgot your password?
              </a>
            </div>
          </div>

          <div>
            <button
              type="submit"
              class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-primary-500/25"
            >
              <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                <i
                  class="fas fa-sign-in-alt text-primary-200 group-hover:text-primary-100 transition-colors"
                ></i>
              </span>
              Sign in
            </button>
          </div>
          <div class="text-sm text-center">
            <a
              href="index.html"
              class="font-medium text-accent-400 hover:text-accent-300 transition-colors"
            >
              Don't have an account? Sign up
            </a>
          </div>
        </form>
      </div>
    </div>

    <!-- Theme Toggle Script (for dark mode functionality) -->
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      themeToggle.addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        const icon = themeToggle.querySelector("i");
        icon.classList.toggle("fa-moon");
        icon.classList.toggle("fa-sun");
      });

      // Particle animation (from manageSubscriptions.html)
      function createParticle() {
        const particle = document.createElement("div");
        particle.className = "particle";
        particle.style.left = Math.random() * 100 + "%";
        particle.style.top = Math.random() * 100 + "%";
        particle.style.width = Math.random() * 4 + 1 + "px";
        particle.style.height = particle.style.width;
        particle.style.backgroundColor = `hsl(${
          Math.random() * 360
        }, 70%, 60%)`;
        document.querySelector(".gradient-bg").appendChild(particle);

        setTimeout(() => {
          particle.remove();
        }, 6000);
      }

      setInterval(createParticle, 2000);

      // Toast Notification System (from manageSubscriptions.html, adapted for login alerts)
      function showToast(message, type = "info") {
        const toastContainer = document.getElementById("toast-container");
        if (!toastContainer) {
          // Create if it doesn't exist (e.g., if login.js doesn't use it)
          const newToastContainer = document.createElement("div");
          newToastContainer.id = "toast-container";
          newToastContainer.className =
            "fixed top-6 left-1/2 transform -translate-x-1/2 z-[999] space-y-2";
          document.body.appendChild(newToastContainer);
        }

        const toast = document.createElement("div");
        const colors = {
          success: "from-success-500 to-success-600",
          error: "from-red-500 to-red-600",
          warning: "from-yellow-500 to-yellow-600",
          info: "from-primary-500 to-primary-600",
        };

        toast.className = `glass-dark rounded-xl p-4 text-white font-medium transform transition-all duration-300 animate-slide-in border-l-4 border-${
          type === "success"
            ? "success"
            : type === "error"
            ? "red"
            : type === "warning"
            ? "yellow"
            : "primary"
        }-500`;
        toast.innerHTML = `
                <div class="flex items-center space-x-3">
                    <i class="fas fa-${
                      type === "success"
                        ? "check-circle"
                        : type === "error"
                        ? "exclamation-circle"
                        : type === "warning"
                        ? "exclamation-triangle"
                        : "info-circle"
                    } text-${
          type === "success"
            ? "success"
            : type === "error"
            ? "red"
            : type === "warning"
            ? "yellow"
            : "primary"
        }-400"></i>
                    <span>${message}</span>
                </div>
            `;

        document.getElementById("toast-container").appendChild(toast);

        setTimeout(() => {
          toast.style.transform = "translateX(100%)";
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      // Existing login.js content would go here, or be linked externally as it is.
      // For demonstration, I'll include a basic login form handler that uses showToast.
      document.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        const loginAlert = document.getElementById("loginAlert");
        const loginAlertMessage = document.getElementById("loginAlertMessage");

        if (loginForm) {
          loginForm.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent default form submission

            const username = document.getElementById("username").value;
            const businessName = document.getElementById("businessName").value;
            const password = document.getElementById("password").value;

            // Simple validation (replace with actual authentication logic)
            if (
              username === "user@example.com" &&
              businessName === "MyBusiness" &&
              password === "password123"
            ) {
              showToast("Login successful! Redirecting...", "success");
              loginAlert.classList.add("hidden");
              // Simulate redirect
              setTimeout(() => {
                window.location.href = "sales.html"; // Or your dashboard page
              }, 1500);
            } else {
              loginAlertMessage.textContent =
                "Invalid credentials or business name.";
              loginAlert.classList.remove("hidden");
              showToast(
                "Login failed. Please check your credentials.",
                "error"
              );
            }
          });
        }
      });
    </script>
    <script src="js/login.js"></script>
  </body>
</html>
