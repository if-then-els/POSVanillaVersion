<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            light: '#42a5f5',
                            DEFAULT: '#1976D2',
                            dark: '#1565C0',
                        },
                        gray: {
                            light: '#F3F6FA',
                            border: '#C8D0DD',
                        },
                    },
                    boxShadow: {
                        card: '0 8px 30px rgba(0, 0, 0, 0.08)',
                        focus: '0 0 0 3px rgba(25, 118, 210, 0.1)',
                        button: '0 4px 12px rgba(25, 118, 210, 0.2)',
                    },
                },
            },
        };
    </script>
</head>
<body class="min-h-screen flex justify-center items-center bg-gradient-to-br from-gray-light to-white font-poppins">
    <div class="w-full max-w-md bg-white rounded-xl shadow-card p-10 relative">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-semibold text-gray-800 mb-2">Owner Login</h1>
            <p class="text-sm text-gray-600">Access your business management system</p>
        </div>
        
        <form id="ownerLoginForm" class="space-y-5">
            <div class="space-y-1.5">
                <label for="phoneNumber" class="block text-sm font-medium text-gray-700">Phone Number</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </div>
                    <input type="tel" id="phoneNumber" placeholder="Enter your phone number" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors">
                </div>
                <p class="hidden text-xs text-red-500 mt-1 error-message">Please enter a valid phone number</p>
            </div>
            
            <div class="space-y-1.5">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>
                    <input type="password" id="password" placeholder="Enter your password" required
                        class="w-full pl-10 pr-4 py-3 border border-gray-border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-colors">
                </div>
                <p class="hidden text-xs text-red-500 mt-1 error-message">Please enter your password</p>
            </div>
            
            <div class="text-right">
                <a href="#" class="text-xs text-gray-600 hover:text-primary hover:underline transition-colors">Forgot Password?</a>
            </div>
            
            <button type="submit" 
                class="w-full py-3.5 bg-primary text-white rounded-lg text-base font-medium transition-all hover:bg-primary-dark hover:shadow-button hover:-translate-y-0.5 active:translate-y-0 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2">
                Login
            </button>
        </form>
    </div>

    <script src="/public/js/ownerslogin.js"></script>
</body>
</html>
