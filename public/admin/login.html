<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperAdmin Login - SwiftPOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script>
    tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: {500:"#64748b",700:"#334155",900:"#0f172a"}, accent:{500:"#0ea5e9"} }}}};
  </script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 rounded-2xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-gradient-to-br from-violet-600 to-indigo-600 rounded-xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-shield-alt text-white"></i></div>
      <h1 class="text-2xl font-black">SwiftPOS <span class="text-violet-400">Owner</span></h1>
      <p class="text-slate-400 text-sm mt-1">Platform SuperAdmin Portal</p>
    </div>
    <div id="alert" class="hidden bg-red-500/20 border border-red-500/30 text-red-300 px-4 py-3 rounded-xl mb-4 text-sm"></div>
    <form id="adminLoginForm" class="space-y-5">
      <div>
        <label class="text-sm text-slate-300">Email</label>
        <input id="email" type="email" required value="owner@swiftpos.co.ke" class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:border-violet-500 focus:outline-none" placeholder="owner@swiftpos.co.ke" />
      </div>
      <div>
        <label class="text-sm text-slate-300">Password</label>
        <input id="password" type="password" required value="Admin123!" class="w-full mt-1 px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:border-violet-500 focus:outline-none" placeholder="••••••••" />
      </div>
      <button type="submit" id="submitBtn" class="w-full py-3.5 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 rounded-xl font-semibold transition-all flex items-center justify-center gap-2">
        <span>Sign In</span> <i class="fas fa-arrow-right"></i>
      </button>
    </form>
    <p class="text-center text-slate-500 text-xs mt-6">Seeds: owner@swiftpos.co.ke / Admin123! — Change after first login via .env</p>
    <div class="text-center mt-4"><a href="/" class="text-slate-400 text-sm hover:text-white"><i class="fas fa-home mr-1"></i> Back to POS</a></div>
  </div>
  <script>
    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('alert');
    const btn = document.getElementById('submitBtn');
    function showAlert(msg){ alertBox.textContent=msg; alertBox.classList.remove('hidden'); }
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      alertBox.classList.add('hidden');
      btn.disabled=true; btn.innerHTML='<i class="fas fa-spinner fa-spin"></i> Signing in...';
      try{
        const res = await fetch('/api/superadmin/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          credentials:'include',
          body: JSON.stringify({ email: document.getElementById('email').value.trim(), password: document.getElementById('password').value })
        });
        const data = await res.json();
        if(!res.ok) throw new Error(data.message||'Login failed');
        // store admin token as cookie is already set by server; also store in localStorage for header reuse
        if(data.token) localStorage.setItem('adminToken', data.token);
        window.location.href = 'dashboard.html';
      }catch(err){
        showAlert(err.message);
      }finally{
        btn.disabled=false; btn.innerHTML='<span>Sign In</span> <i class="fas fa-arrow-right"></i>';
      }
    });
    // if already logged in, try to fetch admin
    (async()=>{
      const token = localStorage.getItem('adminToken');
      if(!token) return;
      try{
        const r = await fetch('/api/superadmin/admin', { headers:{ 'Authorization':'Bearer '+token }, credentials:'include' });
        if(r.ok) window.location.href='dashboard.html';
      }catch(_){}
    })();
  </script>
</body>
</html>
