<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .glass-dark {
        background: rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .gradient-bg {
        background: linear-gradient(-45deg, #0ea5e9, #d946ef, #22c55e, #f59e0b);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }
      @keyframes gradient {
        0%,
        100% {
          background-position: left center;
        }
        50% {
          background-position: right center;
        }
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.6;
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @media (max-width: 767px) {
        body.sidebar-open {
          overflow: hidden;
        }
      }
    </style>
  </head>

  <body class="bg-gray-900 text-white font-inter overflow-x-hidden">
    <div class="fixed inset-0 z-0">
      <div class="gradient-bg absolute inset-0 opacity-20"></div>
      <div class="absolute inset-0">
        <div class="particle w-2 h-2 bg-primary-400 top-1/4 left-1/4"></div>
        <div class="particle w-3 h-3 bg-accent-400 top-3/4 left-3/4"></div>
        <div class="particle w-1 h-1 bg-success-400 top-1/2 left-1/2"></div>
        <div class="particle w-2 h-2 bg-yellow-400 top-1/3 left-2/3"></div>
        <div class="particle w-1 h-1 bg-pink-400 top-2/3 left-1/3"></div>
      </div>
    </div>

    <div
      class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10"
    >
      <div
        class="max-w-md w-full space-y-8 glass-dark p-10 rounded-3xl shadow-lg"
      >
        <div>
          <h2 class="mt-6 text-center text-3xl font-extrabold text-white">
            <i class="fas fa-lock text-primary-400 text-2xl mr-2"></i>
            Forgot Password
          </h2>
          <p class="mt-2 text-center text-sm text-gray-400">
            Enter your email to receive reset instructions
          </p>
        </div>

        <form id="forgotPasswordForm" class="space-y-6">
          <div>
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
              >
                <i class="fas fa-envelope text-gray-400"></i>
              </div>
              <input
                id="email"
                name="email"
                type="email"
                required
                class="appearance-none rounded-xl relative block w-full px-3 py-3 pl-10 border border-gray-600 placeholder-gray-400 text-white bg-gray-800 focus:outline-none focus:ring-primary-500 focus:border-primary-500 sm:text-sm"
                placeholder="Your registered email"
              />
            </div>
          </div>

          <button
            type="submit"
            class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-gradient-to-r from-primary-500 to-primary-600 hover:from-primary-600 hover:to-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition-all duration-300 hover:scale-105 hover:shadow-lg hover:shadow-primary-500/25"
          >
            Send Reset Link
          </button>

          <div class="text-sm text-center">
            <a
              href="login.html"
              class="font-medium text-accent-400 hover:text-accent-300 transition-colors"
            >
              Back to Login
            </a>
          </div>
        </form>
      </div>
    </div>

    <div
      id="toast-container"
      class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[999] space-y-2"
    ></div>

    <script>
      function showToast(message, type = "info") {
        const toast = document.createElement("div");
        toast.className = `glass-dark rounded-xl p-4 text-white font-medium transform transition-all duration-300 animate-slide-in border-l-4 border-${
          type === "success"
            ? "success"
            : type === "error"
            ? "red"
            : type === "warning"
            ? "yellow"
            : "primary"
        }-500`;

        toast.innerHTML = `
          <div class="flex items-center space-x-3">
            <i class="fas fa-${
              type === "success"
                ? "check-circle"
                : type === "error"
                ? "exclamation-circle"
                : type === "warning"
                ? "exclamation-triangle"
                : "info-circle"
            } text-${
          type === "success"
            ? "success"
            : type === "error"
            ? "red"
            : type === "warning"
            ? "yellow"
            : "primary"
        }-400"></i>
            <span>${message}</span>
          </div>
        `;

        const container = document.getElementById("toast-container");
        container.appendChild(toast);

        setTimeout(() => {
          toast.style.transform = "translateX(100%)";
          toast.style.opacity = "0";
          setTimeout(() => toast.remove(), 300);
        }, 3000);
      }

      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          if (!email) {
            showToast(`Please enter a valid email`, "error");
            return;
          }
          try {
            const res = await fetch("/forgot-password", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ email }),
            });
            const data = await res.json();
            if (res.ok) {
              showToast(
                data.message || `Reset link sent to ${email}`,
                "success"
              );
              localStorage.setItem("resetEmail", email);
              window.location.href = "verify-password.html";
            } else {
              showToast(data.message || "Failed to send reset link", "error");
            }
          } catch (err) {
            showToast("Network error. Please try again.", "error");
          }
        });
    </script>
  </body>
</html>
