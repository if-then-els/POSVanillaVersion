    <style>

      }

      }
    </style>
    <!-- ...existing code... -->

    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js");
        });

    <!-- ...existing code... -->
  </head>
  <body class="bg-gray-50">

      </div>

      <!-- Sidebar -->

        id="sidebar"
        class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r shadow-sm transition-all duration-300"

        <div class="flex items-center justify-between h-16 px-4 border-b">
          <div class="flex items-center">

          <button
            id="desktop-sidebar-toggle"
            class="hidden md:block text-gray-500 hover:text-gray-700"
          >
            <i class="fas fa-chevron-left sidebar-text"></i>
          </button>
        </div>
        <div class="h-full overflow-y-auto">
          <nav class="px-2 py-4">
            <div class="space-y-1">
              <a
                href="dashboard.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
              >
                <i
                  class="fas fa-tachometer-alt mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">Dashboard</span>
              </a>
              <a
                href="sales.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"

                <i

                ></i>
                <span class="sidebar-text">Sales</span>
              </a>
              <a
                href="inventory.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
              >
                <i
                  class="fas fa-boxes mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">Inventory</span>
              </a>
              <a
                href="customers.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
              >
                <i
                  class="fas fa-users mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">Customers</span>
              </a>
              <a
                href="reports.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
              >
                <i
                  class="fas fa-chart-bar mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">Reports</span>
              </a>
              <a
                href="users.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
              >
                <i
                  class="fas fa-user-cog mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">User Management</span>
              </a>
              <a
                href="payments.html"
                class="group flex items-center px-2 py-2 text-sm font-medium rounded-md bg-primary-50 text-primary-600"
              >
                <i
                  class="fas fa-credit-card mr-3 text-primary-500 sidebar-icon"
                ></i>
                <span class="sidebar-text">Payment Config</span>
              </a>
              <a

              >

                ></i>
                <span class="sidebar-text">Settings</span>

            </div>

            <div class="mt-8">
              <h3
                class="px-3 text-xs font-semibold text-gray-500 uppercase tracking-wider sidebar-text"
              >
                Account
              </h3>
              <div class="mt-1 space-y-1">
                <a
                  href="profile.html"
                  class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
                >

                    class="fas fa-user mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"
                  ></i>

                </a>
                <a
                  href="#"
                  class="group flex items-center px-2 py-2 text-sm font-medium rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-50"
                >
                  <i
                    class="fas fa-sign-out-alt mr-3 text-gray-400 group-hover:text-gray-500 sidebar-icon"

      <!-- Main Content -->
      <main
        id="main-content"
        class="flex-1 overflow-y-auto ml-64 p-6 transition-all duration-300"
      >
        <div
          class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between gap-4"
        >
          <div>
            <h1 class="text-3xl font-bold">Payment Configuration</h1>
            <p class="text-gray-600">
              Set up mobile money and card payment options for your business
            </p>
          </div>
          <div class="flex gap-2">
            <button
              id="test-payments"
              class="flex items-center px-4 py-2 text-sm font-medium border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-primary"
            >
              <i class="fas fa-bolt mr-2"></i> Test Payments
            </button>
          </div>
        </div>

        <!-- Payment Methods Tabs -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 mb-6">
          <!-- Rest of your payment configuration content remains the same -->
          <!-- ... -->
        </div>
      </main>
    </div>

    <!-- Toast notification container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50"></div>

    <script>
      // Toggle sidebar function
      function toggleSidebar() {
        const sidebar = document.getElementById("sidebar");
        const mainContent = document.getElementById("main-content");
        const toggleIcon = document
          .getElementById("desktop-sidebar-toggle")
          .querySelector("i");

        sidebar.classList.toggle("sidebar-collapsed");

        if (sidebar.classList.contains("sidebar-collapsed")) {
          mainContent.classList.remove("ml-64");
          mainContent.classList.add("main-content-expanded");
          toggleIcon.classList.remove("fa-chevron-left");
          toggleIcon.classList.add("fa-chevron-right");
        } else {
          mainContent.classList.remove("main-content-expanded");
          mainContent.classList.add("ml-64");
          toggleIcon.classList.remove("fa-chevron-right");
          toggleIcon.classList.add("fa-chevron-left");
        }

        // Save state to localStorage
        const isCollapsed = sidebar.classList.contains("sidebar-collapsed");
        localStorage.setItem("sidebarCollapsed", isCollapsed);
      }

      // Mobile sidebar toggle
      document
        .getElementById("mobile-sidebar-toggle")
        .addEventListener("click", function () {
          const sidebar = document.getElementById("sidebar");
          sidebar.classList.toggle("hidden");
        });

      // Desktop sidebar toggle
      document
        .getElementById("desktop-sidebar-toggle")
        .addEventListener("click", toggleSidebar);

      // Check localStorage for saved sidebar state
      document.addEventListener("DOMContentLoaded", function () {
        const isCollapsed = localStorage.getItem("sidebarCollapsed") === "true";
        if (isCollapsed) {
          toggleSidebar(); // This will apply the collapsed state
        }
      });

      // Tab switching functionality
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.addEventListener("click", function () {
          // Remove active class from all buttons
          document.querySelectorAll(".tab-button").forEach((btn) => {
            btn.classList.remove(
              "active",
              "border-primary",
              "text-primary-600"
            );
            btn.classList.add("text-gray-500", "hover:text-gray-700");
          });

          // Add active class to clicked button
          this.classList.add("active", "border-primary", "text-primary-600");
          this.classList.remove("text-gray-500", "hover:text-gray-700");

          // Hide all tab contents
          document.querySelectorAll(".tab-content").forEach((content) => {
            content.classList.add("hidden");
          });

          // Show the selected tab content
          const tabId = this.id.replace("tab-", "") + "-content";
          document.getElementById(tabId).classList.remove("hidden");
        });
      });

      // Toggle password visibility
      document
        .querySelectorAll('[type="password"] + div button')
        .forEach((button) => {
          button.addEventListener("click", function () {
            const input = this.parentElement.previousElementSibling;
            if (input.type === "password") {
              input.type = "text";
              this.innerHTML = '<i class="far fa-eye-slash"></i>';
            } else {
              input.type = "password";
              this.innerHTML = '<i class="far fa-eye"></i>';
            }
          });
        });

      // Form submission handlers
      document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          // Show success toast
          const toast = document.createElement("div");
          toast.className =
            "bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded relative";
          toast.setAttribute("role", "alert");
          toast.innerHTML = `
                    <span class="block sm:inline">Payment settings saved successfully!</span>
                    <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
                        <i class="fas fa-times cursor-pointer" onclick="this.parentElement.parentElement.remove()"></i>
                    </span>
                `;
          document.getElementById("toast-container").appendChild(toast);

          // Remove toast after 5 seconds
          setTimeout(() => {
            toast.remove();
          }, 5000);
        });
      });

      // Test payments button
      document
        .getElementById("test-payments")
        .addEventListener("click", function () {
          const toast = document.createElement("div");
          toast.className =
            "bg-blue-100 border border-blue-400 text-blue-700 px-4 py-3 rounded relative";
          toast.setAttribute("role", "alert");
          toast.innerHTML = `
                <span class="block sm:inline">Initiating test payment transaction...</span>
                <span class="absolute top-0 bottom-0 right-0 px-4 py-3">
                    <i class="fas fa-times cursor-pointer" onclick="this.parentElement.parentElement.remove()"></i>
                </span>
            `;
          document.getElementById("toast-container").appendChild(toast);

          // Remove toast after 5 seconds
          setTimeout(() => {
            toast.remove();
          }, 5000);
        });
    </script>
  </body>
