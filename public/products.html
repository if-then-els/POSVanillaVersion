<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - POS System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: {
                50: "#f0f9ff",
                100: "#e0f2fe",
                200: "#bae6fd",
                300: "#7dd3fc",
                400: "#38bdf8",
                500: "#0ea5e9",
                600: "#0284c7",
                700: "#0369a1",
                800: "#075985",
                900: "#0c4a6e",
              },
            },
          },
        },
      };
    </script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

      body {
        font-family: "Inter", sans-serif;
      }

      .sidebar-item.active {
        background-color: #0ea5e9;
        color: white;
      }

      .sidebar-item.active i {
        color: white;
      }

      /* Transition for sidebar */
      .sidebar {
        transition: transform 0.3s ease-in-out;
      }

      @media (max-width: 768px) {
        .sidebar {
          transform: translateX(-100%);
        }

        .sidebar.open {
          transform: translateX(0);
        }
      }

      /* Modal styles */
      .modal {
        transition: opacity 0.25s ease;
      }

      body.modal-active {
        overflow-x: hidden;
        overflow-y: visible !important;
      }
    </style>
  </head>
  <body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="sidebar bg-white w-64 h-full shadow-lg fixed inset-y-0 left-0 z-50 md:relative md:translate-x-0"
      >
        <div class="flex flex-col h-full">
          <!-- Sidebar Header -->
          <div class="px-4 py-6 border-b">
            <h1 class="text-2xl font-bold text-primary-600">POS System</h1>
          </div>

          <!-- Sidebar Navigation -->
          <nav class="flex-1 px-2 py-4 overflow-y-auto">
            <ul>
              <li class="mb-2">
                <a
                  href="index.html"
                  class="sidebar-item flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-tachometer-alt mr-3 text-primary-500"></i>
                  <span>Dashboard</span>
                </a>
              </li>
              <li class="mb-2">
                <a
                  href="sales.html"
                  class="sidebar-item flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-shopping-cart mr-3 text-primary-500"></i>
                  <span>Sales</span>
                </a>
              </li>
              <li class="mb-2">
                <a
                  href="products.html"
                  class="sidebar-item active flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-box mr-3 text-primary-500"></i>
                  <span>Products</span>
                </a>
              </li>
              <li class="mb-2">
                <a
                  href="inventory.html"
                  class="sidebar-item flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-warehouse mr-3 text-primary-500"></i>
                  <span>Inventory</span>
                </a>
              </li>
              <li class="mb-2">
                <a
                  href="reports.html"
                  class="sidebar-item flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-chart-bar mr-3 text-primary-500"></i>
                  <span>Reports</span>
                </a>
              </li>
              <li class="mb-2">
                <a
                  href="settings.html"
                  class="sidebar-item flex items-center px-4 py-3 text-gray-700 rounded-lg hover:bg-primary-100"
                >
                  <i class="fas fa-cog mr-3 text-primary-500"></i>
                  <span>Settings</span>
                </a>
              </li>
            </ul>
          </nav>

          <!-- Sidebar Footer -->
          <div class="px-4 py-4 border-t">
            <button
              id="logoutBtn"
              class="flex items-center w-full px-4 py-2 text-gray-700 rounded-lg hover:bg-red-100"
            >
              <i class="fas fa-sign-out-alt mr-3 text-red-500"></i>
              <span>Logout</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- Main Content -->
      <div class="flex-1 flex flex-col overflow-hidden">
        <!-- Top Navbar -->
        <header class="bg-white shadow-sm">
          <div class="flex items-center justify-between px-6 py-4">
            <div class="flex items-center">
              <button
                id="sidebarToggle"
                class="text-gray-500 focus:outline-none md:hidden"
              >
                <i class="fas fa-bars text-xl"></i>
              </button>
              <h2 class="text-xl font-semibold text-gray-800 ml-4">Products</h2>
            </div>
            <div class="flex items-center">
              <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3">
                  <i class="fas fa-search text-gray-400"></i>
                </span>
                <input
                  id="productSearch"
                  type="text"
                  class="py-2 pl-10 pr-4 w-64 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500"
                  placeholder="Search products..."
                />
              </div>
              <div class="ml-4 relative">
                <button
                  class="flex items-center text-gray-700 focus:outline-none"
                >
                  <div
                    class="h-8 w-8 rounded-full bg-primary-500 flex items-center justify-center text-white"
                  >
                    <span>JD</span>
                  </div>
                  <span class="ml-2">John Doe</span>
                  <i class="fas fa-chevron-down ml-2 text-xs"></i>
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-1 overflow-y-auto p-6 bg-gray-100">
          <!-- Products Header -->
          <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-semibold text-gray-800">
              Product Management
            </h3>
            <button
              id="addProductBtn"
              class="bg-primary-600 hover:bg-primary-700 text-white font-medium py-2 px-4 rounded-lg flex items-center"
            >
              <i class="fas fa-plus mr-2"></i>
              Add New Product
            </button>
          </div>

          <!-- Products Table -->
          <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="overflow-x-auto">
              <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                  <tr>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Product
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      SKU
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Price
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Stock
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Category
                    </th>
                    <th
                      scope="col"
                      class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider"
                    >
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="productsTableBody"
                  class="bg-white divide-y divide-gray-200"
                >
                  <!-- Products will be loaded here by JavaScript -->
                </tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div
      id="productModal"
      class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50"
    >
      <div
        class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"
      ></div>

      <div
        class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-lg shadow-lg z-50 overflow-y-auto"
      >
        <div class="modal-content py-4 text-left px-6">
          <!-- Modal Header -->
          <div class="flex justify-between items-center pb-3">
            <p id="modalTitle" class="text-xl font-bold">Add New Product</p>
            <div class="modal-close cursor-pointer z-50">
              <i class="fas fa-times text-gray-500 hover:text-gray-800"></i>
            </div>
          </div>

          <!-- Modal Body -->
          <form id="productForm">
            <input type="hidden" id="productId" />

            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="productName"
              >
                Product Name
              </label>
              <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="productName"
                type="text"
                placeholder="Product Name"
                required
              />
            </div>

            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="productSKU"
              >
                SKU
              </label>
              <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="productSKU"
                type="text"
                placeholder="SKU"
                required
              />
            </div>

            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="productDescription"
              >
                Description
              </label>
              <textarea
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="productDescription"
                placeholder="Product Description"
                rows="3"
              ></textarea>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-4">
              <div>
                <label
                  class="block text-gray-700 text-sm font-bold mb-2"
                  for="productPrice"
                >
                  Price ($)
                </label>
                <input
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                  id="productPrice"
                  type="number"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                  required
                />
              </div>

              <div>
                <label
                  class="block text-gray-700 text-sm font-bold mb-2"
                  for="productStock"
                >
                  Stock
                </label>
                <input
                  class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                  id="productStock"
                  type="number"
                  min="0"
                  placeholder="0"
                  required
                />
              </div>
            </div>

            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="productCategory"
              >
                Category
              </label>
              <select
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="productCategory"
                required
              >
                <option value="">Select Category</option>
                <option value="electronics">Electronics</option>
                <option value="clothing">Clothing</option>
                <option value="food">Food & Beverages</option>
                <option value="home">Home & Kitchen</option>
                <option value="other">Other</option>
              </select>
            </div>

            <div class="mb-4">
              <label
                class="block text-gray-700 text-sm font-bold mb-2"
                for="productImage"
              >
                Product Image
              </label>
              <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="productImage"
                type="file"
                accept="image/*"
              />
            </div>

            <div class="flex justify-end pt-2">
              <button
                type="button"
                class="modal-close px-4 bg-gray-200 p-3 rounded-lg text-gray-600 hover:bg-gray-300 mr-2"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="px-4 bg-primary-600 p-3 rounded-lg text-white hover:bg-primary-700"
              >
                Save
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div
      id="deleteModal"
      class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50"
    >
      <div
        class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50"
      ></div>

      <div
        class="modal-container bg-white w-11/12 md:max-w-md mx-auto rounded-lg shadow-lg z-50 overflow-y-auto"
      >
        <div class="modal-content py-4 text-left px-6">
          <!-- Modal Header -->
          <div class="flex justify-between items-center pb-3">
            <p class="text-xl font-bold text-red-600">Confirm Delete</p>
            <div class="modal-close cursor-pointer z-50">
              <i class="fas fa-times text-gray-500 hover:text-gray-800"></i>
            </div>
          </div>

          <!-- Modal Body -->
          <div class="my-5">
            <p>
              Are you sure you want to delete this product? This action cannot
              be undone.
            </p>
            <p id="deleteProductName" class="font-semibold mt-2"></p>
          </div>

          <div class="flex justify-end pt-2">
            <button
              type="button"
              class="modal-close px-4 bg-gray-200 p-3 rounded-lg text-gray-600 hover:bg-gray-300 mr-2"
            >
              Cancel
            </button>
            <button
              id="confirmDeleteBtn"
              type="button"
              class="px-4 bg-red-600 p-3 rounded-lg text-white hover:bg-red-700"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/main.js"></script>
    <script src="js/products.js"></script>
  </body>
</html>
