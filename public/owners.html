<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Sign-up</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #f5f7fa;
        padding: 20px;
      }

      .signup-container {
        width: 450px;
        background-color: white;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 40px;
        position: relative;
      }

      .signup-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .signup-header h1 {
        font-size: 24px;
        font-weight: 600;
        color: #333;
        margin-bottom: 8px;
      }

      .signup-header p {
        font-size: 14px;
        color: #666;
      }

      .input-group {
        margin-bottom: 20px;
        position: relative;
      }

      .input-group label {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: #555;
        margin-bottom: 6px;
      }

      .input-group input {
        width: 100%;
        padding: 12px 12px 12px 40px;
        border: 1.5px solid #c5cae9;
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.3s ease;
        outline: none;
      }

      .input-group input:focus {
        border-color: #1976d2;
        box-shadow: 0 0 0 2px rgba(25, 118, 210, 0.1);
      }

      .input-group input::placeholder {
        color: #a0a0a0;
      }

      .input-icon {
        position: absolute;
        left: 12px;
        top: 38px;
        color: #7986cb;
      }

      .signup-btn {
        width: 100%;
        padding: 14px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .signup-btn:hover {
        background-color: #1565c0;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(25, 118, 210, 0.2);
      }

      .signup-btn:active {
        transform: translateY(0);
      }

      /* Icons */
      .icon {
        width: 18px;
        height: 18px;
      }

      /* Validation styles */
      .input-group.error input {
        border-color: #e53935;
      }

      .error-message {
        color: #e53935;
        font-size: 12px;
        margin-top: 4px;
        display: none;
      }

      .input-group.error .error-message {
        display: block;
      }
    </style>
    <!-- ...existing code... -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4F46E5" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/service-worker.js");
        });
      }
    </script>
    <!-- ...existing code... -->
  </head>
  <body>
    <div class="signup-container">
      <div class="signup-header">
        <h1>Create Owner Account</h1>
        <p>Please fill in the details to register as an owner</p>
      </div>

      <form id="ownerSignupForm">
        <div class="input-group">
          <label for="fullName">Full Name</label>
          <span class="input-icon">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#7986CB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </span>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />
          <div class="error-message">Please enter your full name</div>
        </div>

        <div class="input-group">
          <label for="nationalId">National ID</label>
          <span class="input-icon">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#7986CB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="16" rx="2" ry="2"></rect>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="12" y1="11" x2="12" y2="15"></line>
              <line x1="10" y1="13" x2="14" y2="13"></line>
            </svg>
          </span>
          <input
            type="text"
            id="nationalId"
            placeholder="Enter your National ID"
            required
          />
          <div class="error-message">Please enter a valid National ID</div>
        </div>

        <div class="input-group">
          <label for="phoneNumber">Active Phone Number</label>
          <span class="input-icon">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#7986CB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
          </span>
          <input
            type="tel"
            id="phoneNumber"
            placeholder="Enter your phone number"
            required
          />
          <div class="error-message">Please enter a valid phone number</div>
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <span class="input-icon">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#7986CB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              ></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </span>
          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            required
          />
          <div class="error-message">Please enter a valid email address</div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <span class="input-icon">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#7986CB"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </span>
          <input
            type="password"
            id="password"
            placeholder="Create a strong password"
            required
          />
          <div class="error-message">
            Password must be at least 8 characters
          </div>
        </div>

        <button type="submit" class="signup-btn">Sign Up</button>
      </form>
    </div>

    <script src="../public/js/owners.js"></script>
  </body>
</html>
