<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receipt - SwiftPOS</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Barcode+128&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        body {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        .no-print {
          display: none !important;
        }
      }

      body {
        font-family: "Inter", sans-serif;
        background-color: #f9fafb;
        color: #111827;
        padding: 2rem;
      }

      .receipt-container {
        max-width: 400px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .receipt-header {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        color: white;
        padding: 1.5rem;
        text-align: center;
      }

      .store-name {
        font-size: 1.5rem;
        font-weight: 800;
        margin-bottom: 0.25rem;
      }

      .store-details {
        font-size: 0.875rem;
        opacity: 0.9;
        margin-bottom: 0.5rem;
      }

      .receipt-content {
        padding: 1.5rem;
      }

      .receipt-title {
        font-size: 1.25rem;
        font-weight: 700;
        text-align: center;
        margin-bottom: 1.5rem;
        color: #1e293b;
      }

      .sale-info {
        display: flex;
        justify-content: space-between;
        margin-bottom: 1.5rem;
        font-size: 0.875rem;
      }

      .items-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
      }

      .items-table th {
        text-align: left;
        padding: 0.5rem 0;
        border-bottom: 1px solid #e2e8f0;
        font-weight: 600;
        color: #64748b;
      }

      .items-table td {
        padding: 0.75rem 0;
        border-bottom: 1px solid #f1f5f9;
      }

      .item-name {
        font-weight: 500;
      }

      .item-qty,
      .item-price,
      .item-total {
        text-align: right;
      }

      .totals {
        background: #f8fafc;
        border-radius: 8px;
        padding: 1.25rem;
        margin-bottom: 1.5rem;
      }

      .total-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.75rem;
      }

      .total-label {
        color: #64748b;
      }

      .total-value {
        font-weight: 600;
      }

      .grand-total {
        font-size: 1.25rem;
        font-weight: 700;
        color: #0f172a;
        border-top: 1px dashed #cbd5e1;
        padding-top: 0.75rem;
        margin-top: 0.5rem;
      }

      .payment-method {
        text-align: center;
        padding: 0.5rem;
        background: #f0fdfa;
        border-radius: 6px;
        color: #0d9488;
        font-weight: 600;
        margin-bottom: 1.5rem;
      }

      .footer-message {
        text-align: center;
        color: #64748b;
        font-size: 0.875rem;
        margin-bottom: 1.5rem;
      }

      .barcode {
        text-align: center;
        font-family: "Libre Barcode 128", cursive;
        font-size: 2.5rem;
        letter-spacing: 2px;
        margin-top: 1rem;
      }

      .actions {
        display: flex;
        justify-content: center;
        gap: 1rem;
        margin-top: 2rem;
      }

      .print-btn {
        background: linear-gradient(135deg, #0ea5e9, #0284c7);
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .print-btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="receipt-container">
      <div class="receipt-header">
        <div class="store-name" id="store-name">SwiftPOS Store</div>
        <div class="store-details">
          <div id="store-address">123 Business Street, Nairobi</div>
          <div id="store-phone">Phone: +254 700 000 000</div>
          <div id="store-email">Email: info@swiftpos.com</div>
        </div>
      </div>

      <div class="receipt-content">
        <h2 class="receipt-title">SALES RECEIPT</h2>

        <div class="sale-info">
          <div>
            <div><strong>Receipt #:</strong> <span id="receipt-id"></span></div>
            <div><strong>Date:</strong> <span id="sale-date"></span></div>
          </div>
          <div>
            <div>
              <strong>Cashier:</strong> <span id="cashier-name">Admin</span>
            </div>
            <div>
              <strong>Customer:</strong> <span id="customer-name"></span>
            </div>
          </div>
        </div>

        <table class="items-table">
          <thead>
            <tr>
              <th>Item</th>
              <th class="item-qty">Qty</th>
              <th class="item-price">Price</th>
              <th class="item-total">Total</th>
            </tr>
          </thead>
          <tbody id="items-list">
            <!-- Items will be populated here -->
          </tbody>
        </table>

        <div class="totals">
          <div class="total-row">
            <div class="total-label">Subtotal</div>
            <div class="total-value" id="subtotal">KES 0.00</div>
          </div>
          <div class="total-row">
            <div class="total-label">Tax (<span id="tax-rate">0</span>%)</div>
            <div class="total-value" id="tax-amount">KES 0.00</div>
          </div>
          <div class="total-row grand-total">
            <div class="total-label">TOTAL</div>
            <div class="total-value" id="grand-total">KES 0.00</div>
          </div>
        </div>

        <div class="payment-method">
          <i class="fas fa-credit-card mr-2"></i>
          Payment: <span id="payment-method"></span>
        </div>

        <div class="footer-message">Thank you for your business!<br /></div>

        <div class="barcode">
          *<span id="barcode-content">1234567890</span>*
        </div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="print-btn" onclick="window.print()">
        <i class="fas fa-print"></i> Print Receipt
      </button>
      <button class="print-btn" onclick="window.close()">
        <i class="fas fa-times"></i> Close
      </button>
    </div>
    <script src="js/chat2.js"></script>
    <script>
      // Get sale ID from URL
      const urlParams = new URLSearchParams(window.location.search);
      const saleId = urlParams.get("saleId");

      if (!saleId) {
        alert("Sale ID not provided");
        window.close();
      }

      // Format currency
      function formatCurrency(amount) {
        return new Intl.NumberFormat("en-KE", {
          style: "currency",
          currency: "KES",
        }).format(amount);
      }

      // Format date
      function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString("en-KE", {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      // Generate barcode
      function generateBarcode(id) {
        return id
          .replace(/[^0-9]/g, "")
          .padEnd(12, "0")
          .substring(0, 12);
      }

      // Load receipt data
      async function loadReceipt() {
        try {
          const response = await fetch(`/receipt/${saleId}`);
          const data = await response.json();

          if (!data.sale || !data.store) {
            throw new Error("Invalid receipt data");
          }

          const { sale, store } = data;

          // Populate store info
          document.getElementById("store-name").textContent =
            store.storeName || "SwiftPOS Store";
          document.getElementById("store-address").textContent =
            store.storeAddress || "123 Business Street, Nairobi";
          document.getElementById("store-phone").textContent = `Phone: ${
            store.storePhone || "+254 700 000 000"
          }`;
          document.getElementById("store-email").textContent = `Email: ${
            store.storeEmail || "info@swiftpos.com"
          }`;

          // Populate sale info
          document.getElementById("receipt-id").textContent = sale._id;
          document.getElementById("sale-date").textContent = formatDate(
            sale.createdAt
          );
          document.getElementById("customer-name").textContent =
            sale.customerName || "Walk-in Customer";
          document.getElementById("payment-method").textContent =
            sale.paymentMethod;

          // Populate items
          const itemsList = document.getElementById("items-list");
          itemsList.innerHTML = "";

          sale.items.forEach((item) => {
            const row = document.createElement("tr");
            row.innerHTML = `
            <td class="item-name">${item.productName}</td>
            <td class="item-qty">${item.quantity}</td>
            <td class="item-price">${formatCurrency(item.price)}</td>
            <td class="item-total">${formatCurrency(item.total)}</td>
          `;
            itemsList.appendChild(row);
          });

          // Populate totals
          document.getElementById("subtotal").textContent = formatCurrency(
            sale.subtotal
          );
          document.getElementById("tax-rate").textContent = sale.taxRate;
          document.getElementById("tax-amount").textContent = formatCurrency(
            sale.taxAmount
          );
          document.getElementById("grand-total").textContent = formatCurrency(
            sale.grandTotal
          );

          // Generate barcode
          document.getElementById("barcode-content").textContent =
            generateBarcode(sale._id);
        } catch (error) {
          console.error("Error loading receipt:", error);
          alert("Failed to load receipt data");
          window.close();
        }
      }

      // Initialize when page loads
      document.addEventListener("DOMContentLoaded", loadReceipt);
    </script>
  </body>
</html>
